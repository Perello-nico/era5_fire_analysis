# This is an example configuration file for generating point data only plots.

start: "2023-07-24T00:00:00Z"
end: "2023-07-26T23:00:00Z"

# Optional event annotations on meteograms; independent of the download period.
# Omit end to draw only the start line. Naive timestamps are interpreted as UTC.
# event:
#   name: Fire event
#   start: "2023-07-24T14:30:00+02:00"
#   end: "2023-07-26T18:00:00+02:00"

mode: point

point:
  name: Palermo
  latitude: 38.12
  longitude: 13.36

timezone: Europe/Rome
output: output/output_point_data_only

outputs:
  png: false
  pdf: false
  interactive: false

# Shapefile overlays apply to maps only; see example_everything.yaml.
