# All input timestamps are UTC. End is inclusive. Example only: replace as needed.
start: "2023-07-24T00:00:00Z"
end: "2023-07-26T23:00:00Z"
point:
  name: Palermo
  latitude: 38.12
  longitude: 13.36
# Bounding box in degrees, longitude in [-180, 180].
region:
  north: 39.0
  west: 11.0
  south: 36.0
  east: 16.0
# both, point, or maps
mode: both
maps:
  topography: true  # Separate elevation panel; downloads and caches Copernicus GLO-90.
  every_hours: 1
  # Alternatively provide exact UTC timestamps within start/end:
  # times: ["2023-07-24T12:00:00Z", "2023-07-25T15:00:00Z"]
  coastlines: True  # First use may download Cartopy Natural Earth data.
  # for interactive maps
  interactive: True
  interactive_dpi: 110
  interactive_meteogram_dpi: 110
  interactive_interval_ms: 900
  interactive_meteogram: True
  # to plot topography
  topography: True
  topography_zoom: True  # add zoomed view
  topography_zoom_radius_km: 20
  # to add a shapefile
  topography_overlay:
    path: geometry/geometry.shp
    edgecolor: "#d7191c"
    linewidth: 2.0
    alpha: 1.0
    label: Fire perimeter
timezone: Europe/Rome
output: output # Relative to this configuration file.
formats: [png]
