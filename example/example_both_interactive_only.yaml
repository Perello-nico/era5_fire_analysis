# This is an example configuration file for generating both interactive maps and meteogram plots for a specific point and region.

start: "2023-07-24T00:00:00Z"
end: "2023-07-26T23:00:00Z"
mode: both

point:
  name: Palermo
  latitude: 38.12
  longitude: 13.36

region:
  north: 39.0
  west: 11.0
  south: 36.0
  east: 16.0

timezone: Europe/Rome
output: output/example_both_interactive_only

outputs:
  png: false
  pdf: false
  interactive: true

maps:
  every_hours: 1
  coastlines: true
  borders: true
  lakes: true
  cities: true
  topography: true
  topography_zoom: true
  topography_zoom_radius_km: 20
  interactive_dpi: 110
  interactive_meteogram_dpi: 110
  interactive_interval_ms: 900
  interactive_map_layout: column  # column, 2x2, or row
  interactive_meteogram: true
