# This is an example configuration file for generating maps data only plots.

start: "2023-07-24T00:00:00Z"
end: "2023-07-26T23:00:00Z"

# Optional event annotations on meteograms; independent of the download period.
# Omit end to draw only the start line. Naive timestamps are interpreted as UTC.
# event:
#   name: Fire event
#   start: "2023-07-24T14:30:00+02:00"
#   end: "2023-07-26T18:00:00+02:00"

mode: maps

region:
  north: 39.0
  west: 11.0
  south: 36.0
  east: 16.0

timezone: Europe/Rome
output: output/example_maps_data_only

outputs:
  png: false
  pdf: false
  interactive: false

maps:
  every_hours: 1

  # Optional shapefile overlay; enable when generating plots:
  overlay:
    topography: false
    weather: false
    path: geometry/geometry.shp
    edgecolor: "#d7191c"
    linewidth: 2.0
    alpha: 1.0
    label: Fire perimeter
