# This is an example configuration file for generating all plots (point data, meteogram, maps) for a specific point and region.

start: "2023-07-24T00:00:00Z"
end: "2023-07-26T23:00:00Z"

# Optional event annotations on meteograms; independent of the download period.
# Omit end to draw only the start line. Naive timestamps are interpreted as UTC.
event:
  name: Fire event
  start: "2023-07-24T14:30:00+02:00"
  end: "2023-07-26T18:00:00+02:00"

mode: both

point:
  name: Palermo
  latitude: 38.12
  longitude: 13.36

region:
  north: 39.0
  west: 11.0
  south: 36.0
  east: 16.0

timezone: Europe/Rome
output: output/example_everything

outputs:
  png: true
  pdf: true
  interactive: true

maps:
  every_hours: 1
  coastlines: true
  borders: true
  lakes: true
  cities: true
  topography: true
  topography_zoom: true
  topography_zoom_radius_km: 20
  interactive_dpi: 110
  interactive_meteogram_dpi: 110
  interactive_interval_ms: 900
  interactive_map_layout: column  # column, 2x2, or row
  interactive_meteogram: true

  # Optional shapefile overlay (select each map type):
  overlay:
    topography: true  # regional and zoomed topography
    weather: true  # all weather panels
    path: geometry/geometry.shp
    edgecolor: "#d7191c"
    linewidth: 2.0
    alpha: 1.0
    label: Fire perimeter
